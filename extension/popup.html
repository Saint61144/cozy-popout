<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cozy Popout</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="shell">
  <header><p id="title">Finding video…</p><button id="connect" type="button" title="Connect desktop controls">Connect</button></header>
  <p id="status" role="status" aria-live="polite"></p>
  <fieldset id="remote" disabled hidden aria-label="YouTube playback controls">
    <div class="transport">
      <button id="previous" title="Previous YouTube video" aria-label="Previous YouTube video">|◀</button>
      <button id="back" title="Back 10 seconds" aria-label="Back 10 seconds">−10</button>
      <button id="play" title="Play or pause" aria-label="Play or pause">▶</button>
      <button id="forward" title="Forward 10 seconds" aria-label="Forward 10 seconds">+10</button>
      <button id="next" title="Next YouTube video" aria-label="Next YouTube video">▶|</button>
    </div>
    <div class="timeline"><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Seek in video"><output id="time">0:00 / 0:00</output></div>
    <div class="sound">
      <button id="mute" title="Mute or unmute" aria-label="Mute or unmute">Mute</button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      <label for="speed">Speed</label>
      <select id="speed" aria-label="Playback speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option><option value="1" selected>1×</option>
        <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option><option value="2">2×</option>
      </select>
    </div>
  </fieldset>
  </main>
</body>
</html>
